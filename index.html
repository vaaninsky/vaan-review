<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Vaan In Sky</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .star-btn:hover ~ .star-btn svg { fill: #D1D5DB; }
        .star-btn:hover svg, .star-btn-group:hover .star-btn:hover svg ~ svg { fill: #FBBF24; }
        
        /* Pengaturan Background Gambar bg1.jpeg dengan lapisan gelap 60% */
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('bg2.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
    </style>
    
    <script>
        function prosesRating(bintang) {
            const googleLink = "https://search.google.com/local/writereview?placeid=ChIJJ_CrnMz7vi0RUmzbH9C-jM8";
            const waLink = "https://wa.me/6281222020922?text=Halo%20Vaan%20In%20Sky,%20izinkan%20saya%20menyampaikan%20tanggapan%20dan%20evaluasi%20terkait%20pengalaman%20saya%20selama%20berkunjung%20hari%20ini.";
            
            if (bintang >= 4) {
                window.location.href = googleLink; 
            } else {
                window.location.href = waLink; 
            }
        }
    </script>
</head>
<!-- Hapus class bg-white agar background gambar bisa muncul -->
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <svg width="0" height="0" style="position: absolute;">
      <filter id="garis-pinggir">
        <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="tebal"/>
        <feFlood flood-color="#1B3679" result="warna"/>
        <feComposite in="warna" in2="tebal" operator="in" result="garis"/>
        <feMerge><feMergeNode in="garis"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </svg>

    <img src="logo.png" alt="Logo Vaan In Sky" class="h-16 md:h-20 w-auto object-contain mb-8" style="filter: url(#garis-pinggir);">

    <!-- Warna teks diubah menjadi putih (text-white) dan abu-abu terang (text-gray-200) -->
    <h1 class="text-2xl md:text-3xl font-bold text-white mb-2 drop-shadow-md">Terima kasih atas kunjungan Anda!</h1>
    <p class="text-gray-200 mb-8 drop-shadow-md">Bagaimana pengalaman Anda di Vaan In Sky hari ini?</p>

    <!-- Bintang ulasan -->
    <div class="flex space-x-2 star-btn-group mb-12 flex-row-reverse justify-center cursor-pointer">
        <div onclick="prosesRating(5)" class="star-btn transition-transform hover:scale-110 peer">
            <svg class="w-12 h-12 text-gray-400 hover:text-yellow-400 fill-current drop-shadow-lg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>

        </div>
        <div onclick="prosesRating(3)" class="star-btn transition-transform hover:scale-110 peer">
            <svg class="w-12 h-12 text-gray-400 hover:text-yellow-400 fill-current drop-shadow-lg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>

    <!-- Link diubah warnanya agar lebih terang -->
